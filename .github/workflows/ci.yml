name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint alert rules
        run: docker run --rm -v "$PWD/observability:/w" -w /w --entrypoint promtool prom/prometheus:v2.53.0 check rules alerts.yml
      - name: Unit-test alert rules
        run: docker run --rm -v "$PWD/observability:/w" -w /w --entrypoint promtool prom/prometheus:v2.53.0 test rules alerts.test.yml
      - name: Validate Grafana dashboard JSON
        run: jq -e '.panels | length > 0' observability/grafana/dashboards/scamshield.json
      - name: Validate Compose files
        env:
          INDICATOR_KEY_SECRET: ci-placeholder-0123456789abcdef0123
          GRAFANA_ADMIN_PASSWORD: ci-placeholder
          SCAMSHIELD_IMAGE: ghcr.io/${{ github.repository }}:ci
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f deploy/compose.prod.yml config -q

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false
      - run: terraform validate

  # Builds the image and runs the whole stack, so container-level bugs
  # (permissions, ports, config mounts) fail CI rather than a deployment.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    env:
      INDICATOR_KEY_SECRET: ci-only-secret-0123456789abcdef0123456
      GRAFANA_ADMIN_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: scripts/smoke.sh
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  # Continuous delivery: every green commit on main is published to GHCR,
  # tagged with its commit SHA and "latest". deploy.yml rolls a tag out to AWS.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, observability, terraform, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
