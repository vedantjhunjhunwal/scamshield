groups:
  - name: scamshield
    rules:
      - alert: ShardDown
        expr: up{job="scamshield-shards"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Shard {{ $labels.instance }} is down"
          description: "Keys it replicates are running on two copies; a second failure loses write quorum for them."

      - alert: GatewayDown
        expr: up{job="scamshield-gateway"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Gateway {{ $labels.instance }} is not serving metrics"

      - alert: QuorumFailures
        expr: |
          sum(rate(gateway_requests_total{outcome="no_quorum"}[5m]))
            / clamp_min(sum(rate(gateway_requests_total[5m])), 1e-9) > 0.01
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "More than 1% of requests are failing for lack of quorum"
          description: "Clients are receiving 503s. Check ShardDown and network between gateway and shards."

      - alert: CheckLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(gateway_request_duration_seconds_bucket{op="check"}[5m]))) > 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "p95 check latency above 100 ms for 10 minutes"

      - alert: ReportLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(gateway_request_duration_seconds_bucket{op="report"}[5m]))) > 0.25
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "p95 report latency above 250 ms for 10 minutes"

      - alert: ReplicationBacklog
        expr: max(shard_pending_replications) > 1000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "A shard has over 1,000 unacknowledged replica updates"
          description: "Anti-entropy is not keeping up; replicas are diverging."

      - alert: ReportAbuseSpike
        expr: sum(rate(gateway_requests_total{op="report",outcome="rate_limited"}[5m])) > 5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Sustained rate-limited reports: possible coordinated false-report campaign"
