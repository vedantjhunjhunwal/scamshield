# Three storage shards, a gateway, Prometheus (with alert rules) and Grafana.
# Requires INDICATOR_KEY_SECRET and GRAFANA_ADMIN_PASSWORD, e.g. in a .env file.
x-shards: &shards
  SHARDS: s1=http://s1:7001,s2=http://s2:7002,s3=http://s3:7003

x-shard: &shard
  build: .
  restart: unless-stopped
  environment: *shards

services:
  s1:
    <<: *shard
    command: ["shard", "s1", "7001"]
    volumes: ["s1-data:/data"]
  s2:
    <<: *shard
    command: ["shard", "s2", "7002"]
    volumes: ["s2-data:/data"]
  s3:
    <<: *shard
    command: ["shard", "s3", "7003"]
    volumes: ["s3-data:/data"]
  gateway:
    build: .
    restart: unless-stopped
    command: ["gateway", "8080"]
    environment:
      <<: *shards
      GATEWAY_WORKERS: "2"
      METRICS_PORT: "9100"
      INDICATOR_KEY_SECRET: ${INDICATOR_KEY_SECRET:?set INDICATOR_KEY_SECRET (32+ random characters)}
    ports: ["8080:8080"]
    depends_on: [s1, s2, s3]
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [gateway]
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

volumes:
  s1-data:
  s2-data:
  s3-data:
