# Three storage shards, a gateway and Prometheus scraping all of them.
x-shards: &shards
  SHARDS: s1=http://s1:7001,s2=http://s2:7002,s3=http://s3:7003

services:
  s1:
    build: .
    command: ["shard", "s1", "7001"]
    environment: *shards
    volumes: ["s1-data:/data"]
  s2:
    build: .
    command: ["shard", "s2", "7002"]
    environment: *shards
    volumes: ["s2-data:/data"]
  s3:
    build: .
    command: ["shard", "s3", "7003"]
    environment: *shards
    volumes: ["s3-data:/data"]
  gateway:
    build: .
    command: ["gateway", "8080"]
    environment:
      <<: *shards
      GATEWAY_WORKERS: "2"
    ports: ["8080:8080"]
    depends_on: [s1, s2, s3]
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [gateway]

volumes:
  s1-data:
  s2-data:
  s3-data:
